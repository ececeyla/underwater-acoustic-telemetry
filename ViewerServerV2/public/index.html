<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer Server V2 - Control Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🌊 Acoustic Modem Control Panel</h1>
                <p class="subtitle">Sistema de monitorización y control de nodos de superficie</p>
            </div>
            <div class="header-actions">
                <button id="btnDiscover" class="btn btn-primary">
                    <span class="icon">🔍</span> Descubrir Nodos
                </button>
                <button id="btnAddManual" class="btn btn-secondary">
                    <span class="icon">➕</span> Añadir Manual
                </button>
            </div>
        </header>

        <!-- Modal para añadir nodo manual -->
        <div id="modalAddNode" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Añadir Nodo Manual</h2>
                    <button class="btn-close" id="btnCloseModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="inputNodeIp">Dirección IP del nodo:</label>
                        <input type="text" id="inputNodeIp" placeholder="192.168.1.100" class="form-input">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="btnCancelModal">Cancelar</button>
                    <button class="btn btn-primary" id="btnSaveNode">Guardar</button>
                </div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <div id="statusBar" class="status-bar">
                <span id="statusText">Conectando...</span>
                <span id="statusCount" class="badge">0 nodos</span>
            </div>

            <div id="nodesList" class="nodes-grid">
                <!-- Los nodos se insertan dinámicamente aquí -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📡</div>
                <h2>No hay nodos descubiertos</h2>
                <p>Inicia un escaneo de la LAN o añade un nodo manualmente</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
